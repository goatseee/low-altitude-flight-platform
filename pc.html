<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>低空智控平台 · PC端申请系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f5f7fa;-webkit-font-smoothing:antialiased}
/* ============ PC端申请系统（按小程序UI复刻） ============ */
/* 登录视图 */
.apc-login-view{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#0a1f3c 0%,#103258 40%,#f5f7fa 100%);padding:48px 16px 36px}
.apc-lg-head{text-align:center;margin-bottom:18px}
.apc-logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#0082D9,#2de2f0);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px;box-shadow:0 4px 20px rgba(0,130,217,.3)}
.apc-login-title{text-align:center;font-size:20px;font-weight:700;color:#e8f1fb}
.apc-login-sub{text-align:center;font-size:12px;color:#6b87a8;margin-top:4px}
.apc-login-card{width:100%;max-width:430px;background:#fff;border-radius:18px;padding:24px 22px;box-shadow:0 8px 30px rgba(10,31,60,.08)}
.apc-ltab{display:flex;margin-bottom:20px;border-bottom:2px solid #eef2f7}
.apc-ltab div{flex:1;text-align:center;padding:10px 0;font-size:14px;color:#8aa0bb;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.apc-ltab div.active{color:#0082D9;border-bottom-color:#0082D9;font-weight:600}
.apc-regtype{display:flex;margin-bottom:16px;border-radius:10px;overflow:hidden;border:1px solid #eef2f7}
.apc-regtype div{flex:1;text-align:center;padding:9px 0;font-size:13px;color:#8aa0bb;cursor:pointer;background:#f5f7fa;transition:all .2s}
.apc-regtype div.active{background:#0082D9;color:#fff;font-weight:600}
.apc-lf{margin-bottom:14px}
.apc-lf label{display:block;font-size:12px;color:#8aa0bb;margin-bottom:6px}
.apc-lf input,.apc-lf select{width:100%;border:1px solid #eef2f7;border-radius:10px;padding:12px 14px;font-size:14px;color:#1a2b42;outline:none;font-family:inherit;box-sizing:border-box;transition:border-color .2s}
.apc-lf input:focus,.apc-lf select:focus{border-color:#0082D9}
.apc-code{display:flex;gap:10px}
.apc-code input{flex:1}
.apc-code button{white-space:nowrap;padding:0 14px;border:1px solid #0082D9;border-radius:10px;background:transparent;color:#0082D9;font-size:12px;cursor:pointer;font-family:inherit}
.apc-code button:disabled{opacity:.5}
.apc-btn-main{width:100%;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#0082D9,#2de2f0);color:#fff;margin-top:8px;font-family:inherit;transition:filter .15s}
.apc-btn-main:hover{filter:brightness(1.06)}
.apc-lhint{text-align:center;font-size:11px;color:#8aa0bb;margin-top:14px}
/* 应用视图 */
.apc-app{min-height:100vh;background:#f5f7fa;display:flex;flex-direction:column}
.apc-head{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#0a1f3c,#103258);padding:0 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:0 2px 14px rgba(10,31,60,.25)}
.apc-head .brand{display:flex;align-items:center;gap:10px;color:#e8f1fb;font-size:16px;font-weight:700;padding:12px 0;white-space:nowrap}
.apc-head .brand .b-logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#0082D9,#2de2f0);display:flex;align-items:center;justify-content:center;font-size:16px}
.apc-navs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto}
.apc-navs div{padding:15px 15px;color:#8aa0bb;font-size:14px;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;transition:color .2s}
.apc-navs div:hover{color:#e8f1fb}
.apc-navs div.active{color:#fff;border-bottom-color:#0082D9;font-weight:600}
.apc-head .user{display:flex;align-items:center;gap:12px;color:#8aa0bb;font-size:12.5px;padding:12px 0;white-space:nowrap}
.apc-head .user .exit{cursor:pointer;color:#e8f1fb;background:rgba(255,255,255,.12);padding:5px 14px;border-radius:14px;font-size:12px}
.apc-head .user .exit:hover{background:rgba(255,255,255,.25)}
.apc-main{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:18px 20px 36px}
.apc-view{display:none}.apc-view.active{display:block}
/* 首页 */
.apc-hero{background:linear-gradient(135deg,#0a1f3c,#103258);border-radius:16px;padding:22px 24px 58px;position:relative;margin-bottom:34px}
.apc-hero .urow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.apc-hero .ava{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0082D9,#2de2f0);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.apc-hero .un{color:#e8f1fb;font-size:15px;font-weight:600}
.apc-hero .ur{color:#6b87a8;font-size:11px}
.apc-hero .h1{color:#e8f1fb;font-size:17px;font-weight:700}
.apc-hstats{position:absolute;left:20px;right:20px;bottom:-28px;display:flex;gap:12px}
.apc-hstats .hs{flex:1;background:#fff;border-radius:14px;padding:16px 10px;text-align:center;box-shadow:0 4px 16px rgba(10,31,60,.06);cursor:pointer;transition:transform .15s}
.apc-hstats .hs:hover{transform:translateY(-2px)}
.apc-hstats .hv{font-size:24px;font-weight:800;color:#0082D9}
.apc-hstats .hl{font-size:12px;color:#8aa0bb;margin-top:2px}
.apc-sec{font-size:14px;font-weight:700;color:#1a2b42;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.apc-sec::before{content:'';width:4px;height:14px;background:#0082D9;border-radius:2px}
.apc-sec .more{margin-left:auto;font-size:11px;color:#8aa0bb;font-weight:400;cursor:pointer}
.apc-sec .more:hover{color:#0082D9}
.apc-fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0}
.apc-fg{background:#fff;border-radius:14px;padding:16px 6px;text-align:center;cursor:pointer;transition:transform .15s;box-shadow:0 1px 6px rgba(10,31,60,.04)}
.apc-fg:hover{transform:translateY(-2px)}
.apc-fg .fi{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 6px}
.apc-fg .fi.blue{background:#e6f2ff}
.apc-fg .fi.cyan{background:#e0fbff}
.apc-fg .fi.green{background:#e8f9ee}
.apc-fg .fi.amber{background:#fff8e6}
.apc-fg .fl{font-size:12px;color:#1a2b42;font-weight:600}
.apc-fg .fb{font-size:10px;color:#d63031;background:#fdeaea;padding:1px 6px;border-radius:8px;margin-left:3px}
.apc-nl{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;box-shadow:0 1px 6px rgba(10,31,60,.04);transition:background .15s}
.apc-nl:hover{background:#f0f4fa}
.apc-nl .nt{flex:1;font-size:13px;font-weight:600;color:#1a2b42;line-height:1.4}
.apc-nl .nd{font-size:11px;color:#8aa0bb;margin-top:3px}
.apc-tag{flex-shrink:0;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;margin-top:1px}
.apc-tag.red{background:#fdeaea;color:#d63031}
.apc-tag.blue{background:#e6f2ff;color:#0077d9}
.apc-tag.green{background:#e8f9ee;color:#1f9d55}
/* 通用卡片 */
.apc-li{background:#fff;border-radius:12px;padding:14px 16px;cursor:pointer;transition:transform .12s;box-shadow:0 1px 6px rgba(10,31,60,.04);border:1px solid transparent}
.apc-li:hover{transform:translateY(-2px);border-color:#cfe4ff}
.apc-li-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.apc-li-id{font-size:13px;font-weight:700;color:#1a2b42}
.apc-st{font-size:11px;padding:2px 10px;border-radius:10px;font-weight:600;white-space:nowrap}
.apc-st.orange{background:#fff3e6;color:#e07b00}
.apc-st.green{background:#e8f9ee;color:#1f9d55}
.apc-st.blue{background:#e6f2ff;color:#0077d9}
.apc-st.red{background:#fdeaea;color:#d63031}
.apc-st.gray{background:#f0f2f5;color:#7a8aa0}
.apc-li-row{display:flex;font-size:12px;margin-bottom:4px}
.apc-li-row .k{color:#8aa0bb;width:76px;flex-shrink:0}
.apc-li-row .v{color:#1a2b42;font-weight:500;flex:1}
.apc-prog{margin-top:8px;display:flex;align-items:center;gap:8px}
.apc-prog .bar{flex:1;height:5px;background:#eef2f7;border-radius:3px;overflow:hidden}
.apc-prog .fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#0082D9,#2de2f0)}
.apc-prog .txt{font-size:10px;color:#8aa0bb;white-space:nowrap}
.apc-cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
/* 列表页 */
.apc-lhead{background:linear-gradient(135deg,#0a1f3c,#103258);border-radius:14px 14px 0 0;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.apc-lhead h2{font-size:17px;font-weight:700;color:#e8f1fb;margin:0}
.apc-lhead .sub{font-size:11px;color:#6b87a8;margin-top:2px}
.apc-add{padding:9px 18px;border:none;border-radius:10px;background:linear-gradient(135deg,#0082D9,#2de2f0);color:#fff;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 10px rgba(0,130,217,.35);font-family:inherit;transition:filter .15s}
.apc-add:hover{filter:brightness(1.06)}
.apc-ltabs{display:flex;background:#fff;border-bottom:1px solid #eef2f7;padding:0 8px;border-radius:0 0 14px 14px;overflow-x:auto}
.apc-ltabs div{padding:12px 18px;text-align:center;font-size:13px;color:#8aa0bb;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.apc-ltabs div.active{color:#0082D9;border-bottom-color:#0082D9;font-weight:600}
.apc-lcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.apc-empty{grid-column:1/-1;text-align:center;padding:44px;color:#aab;font-size:13px}
/* 详情页 */
.apc-dhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.apc-back{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #eef2f7;border-radius:10px;padding:8px 16px;font-size:13px;color:#4a5f7c;cursor:pointer;transition:all .15s;font-family:inherit}
.apc-back:hover{color:#0082D9;border-color:#cfe4ff}
.apc-dtitle{font-size:17px;font-weight:700;color:#1a2b42}
.apc-dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.apc-dcard{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 6px rgba(10,31,60,.04)}
.apc-dcard h3{font-size:14px;font-weight:700;color:#1a2b42;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid #eef2f7;display:flex;align-items:center;gap:8px}
.apc-dcard h3::before{content:'';width:4px;height:14px;background:#0082D9;border-radius:2px}
.apc-dcard.full{grid-column:1/-1}
.apc-dgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.apc-ditem{display:flex;align-items:center;gap:6px;font-size:13px}
.apc-ditem .k{color:#8aa0bb;flex-shrink:0}
.apc-ditem .v{color:#1a2b42;font-weight:600}
.apc-timeline{padding:4px 0 0 4px;max-width:520px}
.apc-tl{display:flex;gap:14px;padding-bottom:18px;position:relative}
.apc-tl:last-child{padding-bottom:0}
.apc-tl-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;z-index:1}
.apc-tl-dot.done{background:#e8f9ee;color:#34d399;border:2px solid #34d399}
.apc-tl-dot.cur{background:#e6f2ff;color:#0082D9;border:2px solid #0082D9;animation:apcPulse 1.8s infinite}
.apc-tl-dot.wait{background:#f0f2f5;color:#aab;border:2px solid #ccd}
@keyframes apcPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,130,217,.3)}50%{box-shadow:0 0 0 6px rgba(0,130,217,0)}}
.apc-tl-line{position:absolute;left:11px;top:24px;bottom:0;width:2px;background:#eef2f7}
.apc-tl.done .apc-tl-line{background:#34d399}
.apc-tl:last-child .apc-tl-line{display:none}
.apc-tl-c{flex:1;padding-top:1px}
.apc-tl-name{font-size:13px;font-weight:700;color:#1a2b42}
.apc-tl-time{font-size:11px;color:#8aa0bb;margin-top:2px}
.apc-tl-st{font-size:11px;margin-top:3px}
.apc-tl-st.done{color:#34d399}
.apc-tl-st.cur{color:#0082D9}
.apc-tl-st.wait{color:#aab}
/* 表单弹窗（PC居中） */
.apc-fmask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150;display:none;align-items:center;justify-content:center;padding:24px}
.apc-fmask.show{display:flex}
.apc-fsheet{background:#fff;width:100%;max-width:720px;border-radius:18px;max-height:85vh;overflow-y:auto;box-shadow:0 16px 60px rgba(10,31,60,.25)}
.apc-fs-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #eef2f7;position:sticky;top:0;background:#fff;border-radius:18px 18px 0 0;z-index:2}
.apc-fs-head h3{font-size:16px;font-weight:700;color:#1a2b42;margin:0}
.apc-fs-x{font-size:20px;color:#8aa0bb;cursor:pointer;padding:4px 8px;line-height:1}
.apc-fs-x:hover{color:#1a2b42}
.apc-fs-body{padding:18px 20px}
.apc-fs-row{display:flex;gap:14px;margin-bottom:14px}
.apc-ff{flex:1;min-width:0}
.apc-ff label{display:block;font-size:12px;color:#8aa0bb;margin-bottom:6px}
.apc-ff label .req{color:#d63031}
.apc-ff input,.apc-ff select{width:100%;border:1px solid #eef2f7;border-radius:10px;padding:11px 13px;font-size:13px;color:#1a2b42;outline:none;font-family:inherit;box-sizing:border-box}
.apc-ff input:focus,.apc-ff select:focus{border-color:#0082D9}
</style>
</head>

  <!-- 应用视图 -->
  <div class="apc-app" id="apcAppView" style="display:none">

<script>
// ============ PC端申请系统（按小程序内容复刻） ============
var APC_DATA={

function apcRenderCards(type){
  var f=apcFilter[type];
  var data=f==='all'?APC_DATA[type]:APC_DATA[type].filter(function(r){return r.status===f});
  var body=document.getElementById('apcListBody');
  if(!body)return;
  if(data.length===0){body.innerHTML='<div class="apc-empty">暂无数据</div>';return}
  var h='';
  data.forEach(function(r){h+=apcCardHtml(type,r)});
  body.innerHTML=h;
}
function apcTimelineHtml(steps){
  var h='<div class="apc-dcard full"><h3>审批进度</h3><div class="apc-timeline">';
  steps.forEach(function(s,i){
    var cls=s.st==='done'?'done':(s.st==='cur'?'cur':'wait');
    var txt=s.st==='done'?'已完成':(s.st==='cur'?'进行中':'待办理');
    var icon=s.st==='done'?'✓':(s.st==='cur'?'●':'○');
    h+='<div class="apc-tl '+cls+'"><div class="apc-tl-dot '+cls+'">'+icon+'</div>';
    if(i<steps.length-1)h+='<div class="apc-tl-line"></div>';
    h+='<div class="apc-tl-c"><div class="apc-tl-name">'+s.name+'</div><div class="apc-tl-time">'+s.time+'</div><div class="apc-tl-st '+cls+'">'+txt+'</div></div></div>';
  });
  return h+'</div></div>';
}
function apcOpenDetail(type,id){
  var r=APC_DATA[type].find(function(x){return x.id===id});if(!r)return;
  apcPrevView=apcCurView;
  var titles={airspace:'空域申请详情',aircraft:'飞行器详情',pilot:'飞手注册详情',user:'用户注册详情'};
  var cards=[];
  if(type==='airspace'){
    cards.push({title:'申请信息',grid:[['申请编号',r.id],['申请类型',r.type],['申请单位',r.unit],['所属片区',r.area],['申请空域',r.airspace],['飞行高度',r.height],['飞行时长',r.duration],['任务用途',r.purpose],['申请时间',r.time],['当前状态',r.status]]});
    cards.push({title:'操作员信息',grid:[['操作员姓名',r.opName],['证件编号',r.opLicense],['联系电话',r.opPhone]]});
    cards.push({title:'飞行器信息',grid:[['飞行器编号',r.acId],['机型',r.acModel],['适航状态','适航']]});
  }else if(type==='aircraft'){
    cards.push({title:'飞行器信息',grid:[['登记编号',r.id],['飞行器编号',r.acId],['机型',r.model],['序列号',r.serial],['所属单位',r.unit],['登记时间',r.regTime]]});
    cards.push({title:'适航与年检',grid:[['适航状态',r.airworthy],['年检到期',r.expire]]});
    cards.push({title:'技术参数',grid:[['起飞重量',r.weight],['最大高度',r.maxHeight]]});
  }else if(type==='pilot'){
    cards.push({title:'基本信息',grid:[['申请编号',r.id],['姓名',r.name],['身份证号',r.idCard],['联系电话',r.phone],['所属单位',r.unit]]});
    cards.push({title:'资质信息',grid:[['证件类型',r.license],['证件编号',r.licNo],['核验类型',r.verifyType],['提交时间',r.time]]});
  }else{
    cards.push({title:'注册信息',grid:[['注册编号',r.id],['用户名',r.name],['手机号',r.phone],['所属单位',r.unit],['申请角色',r.role],['所属片区',r.area],['提交时间',r.time]]});
  }
  var h='<div class="apc-dhead"><span class="apc-back" onclick="apcGoBack()">‹ 返回</span><span class="apc-dtitle">'+(titles[type]||'详情')+'</span></div>';
  h+='<div class="apc-dgrid">';
  cards.forEach(function(c){
    h+='<div class="apc-dcard"><h3>'+c.title+'</h3><div class="apc-dgrid2">';
    c.grid.forEach(function(g){h+='<div class="apc-ditem"><span class="k">'+g[0]+'</span><span class="v">'+g[1]+'</span></div>'});
    h+='</div></div>';
  });
  if(r.steps&&r.steps.length>0)h+=apcTimelineHtml(r.steps);
  h+='</div>';
  document.getElementById('apcViewDetail').innerHTML=h;
  apcShowView('Detail');
}
function apcGoBack(){
  apcNav(apcPrevView);
}

function apcOpenForm(type){
  var f=APC_FORMS[type];if(!f)return;
  var h='<div class="apc-fs-head"><h3>'+f.title+'</h3><span class="apc-fs-x" onclick="apcCloseForm()">✕</span></div><div class="apc-fs-body">';
  f.rows.forEach(function(row){
    h+='<div class="apc-fs-row">';
    row.forEach(function(fd){
      h+='<div class="apc-ff"><label>'+fd.l+' <span class="req">*</span></label>';
      if(fd.t==='select'){h+='<select>';fd.o.forEach(function(o){h+='<option>'+o+'</option>'});h+='</select>'}
      else{h+='<input type="'+fd.t+'" placeholder="'+(fd.p||'')+'">'}
      h+='</div>';
    });
    h+='</div>';
  });
  h+='<button class="apc-btn-main" style="margin-top:4px" onclick="apcSubmitForm(\''+type+'\')">提交申请</button></div>';
  document.getElementById('apcFormSheet').innerHTML=h;
  document.getElementById('apcFormMask').classList.add('show');
}
function apcCloseForm(){document.getElementById('apcFormMask').classList.remove('show')}
function apcSubmitForm(type){
  apcToast('提交成功，等待审核');
  apcCloseForm();
  setTimeout(function(){apcRenderCards(type)},800);
}
